<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研背单词 · 默写自测</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2f6df0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="考研背单词">
<link rel="icon" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --ink:#1f2933; --sub:#6b7785;
    --line:#e3e8ef; --brand:#2f6df0; --brand2:#eaf1ff;
    --ok:#1f9d55; --bad:#e0483e; --warn:#d98a00;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.7;padding:18px}
  .wrap{max-width:820px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  .seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
  .seg button{border:none;background:transparent;color:var(--sub);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:14px}
  .seg button.on{background:var(--brand);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:12px}
  .opts label{cursor:pointer}
  .meta{font-size:12px;color:var(--sub);margin-bottom:6px}
  .prompt{font-size:30px;font-weight:700;margin:6px 0 4px;padding:18px 16px;background:var(--brand2);border-radius:10px;text-align:center}
  .hint{font-size:13px;color:var(--sub);text-align:center;min-height:18px;margin-bottom:12px}
  input.ans{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;color:var(--ink);text-align:center}
  input.ans:focus{outline:none;border-color:var(--brand)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:9px;cursor:pointer;font-size:14px}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.ghost{background:#fff}
  .btn:hover{filter:brightness(.98)}
  .stats{font-size:13px;color:var(--sub);margin-top:10px;text-align:center}
  .result{margin-top:16px;padding:16px;border:1px dashed var(--line);border-radius:10px;display:none;text-align:center}
  .result.show{display:block}
  .verdict{font-size:26px;font-weight:700;margin-bottom:4px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .ansbox{font-size:16px;margin:6px 0}
  .ansbox .y{color:var(--bad)} .ansbox .c{color:var(--ok);font-weight:600}
  .add{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
  .add h3{font-size:14px;margin:0 0 8px;color:var(--sub)}
  .add input{width:100%;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:14px}
  .add a,.hint a{color:var(--brand);text-decoration:underline}
  .tip{font-size:12px;color:var(--sub);margin-top:14px;background:#fff8ec;border:1px solid #f3e2bf;border-radius:8px;padding:10px 12px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>考研背单词 · 默写自测</h1>
    <div class="seg">
      <button id="mEn2zh" class="on" onclick="setMode('en2zh')">看英文写中文</button>
      <button id="mZh2en" onclick="setMode('zh2en')">看中文写英文</button>
    </div>
  </header>

  <div class="card">
    <div class="opts">
      <label>范围：
        <select id="scope" onchange="applyScope()">
          <option value="all">全部词</option>
          <option value="wrong">仅错题</option>
          <option value="mast">仅熟词</option>
        </select>
      </label>
      <label><input type="checkbox" id="rand" onchange="applyScope()"> 随机顺序</label>
      <label><input type="checkbox" id="randDraw"> 随机出词</label>
      <label>判分：
        <select id="judgeMode" onchange="onJudgeMode()">
          <option value="kw">关键词自检(离线)</option>
          <option value="ai">AI 语义判分</option>
        </select>
      </label>
    </div>

    <div class="meta" id="metaInfo"></div>
    <div class="prompt" id="prompt"></div>
    <div class="hint" id="hint"></div>
    <input class="ans" id="answer" placeholder="在此输入答案，回车=批改；批改后回车=下一个" onkeydown="onAnsKey(event)">
    <div class="row">
      <button class="btn primary" onclick="judge()">核对 / 判对错</button>
      <button class="btn ghost" onclick="showAns()">显示答案</button>
      <button class="btn ghost" onclick="prev()">上一个</button>
      <button class="btn ghost" onclick="next()">下一个</button>
      <button class="btn ghost" onclick="randomDraw()">🎲 随机出词</button>
    </div>
    <div class="stats" id="stats"></div>

    <div class="result" id="result">
      <div class="verdict" id="verdict"></div>
      <div class="ansbox" id="ansbox"></div>
      <div class="hint" id="note"></div>
    </div>
  </div>

  <div class="tip">操作：<b>回车=批改</b>，批改后<b>再按回车=跳到下一个单词</b>（也可点按钮）。<b>答对进「熟词本」，答错进「错题本」</b>，用上方“范围”可只刷熟词 / 只刷错题。<b>随机出词</b>：勾选后每次随机抽词检测，或点「🎲 随机出词」当场抽一个。判分方式：<b>关键词自检</b>离线即可；<b>AI 语义判分</b>按“词义接近即可”判并给理由（需填免费 API Key + 联网）。</div>

  <div class="add card" id="aiPanel" style="display:none">
    <h3>🤖 AI 判分设置（填一次即可，仅存本机浏览器 localStorage）</h3>
    <select id="aiProv" onchange="onProv()" style="width:100%;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px">
      <option value="deepseek">DeepSeek（推荐，支持浏览器跨域）</option>
      <option value="qwen">通义千问 DashScope（支持跨域）</option>
      <option value="hunyuan">腾讯混元</option>
      <option value="custom">自定义 OpenAI 兼容</option>
    </select>
    <input id="aiKey" type="password" placeholder="API Key（如 sk-... ）">
    <input id="aiModel" placeholder="模型名（选厂商后自动填，可改）">
    <input id="aiBase" placeholder="API Base URL（自定义时填，否则留空）">
    <div class="hint" style="margin:6px 0 10px;text-align:left">
      去哪申请免费 Key（新用户通常都有免费额度）：
      <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">DeepSeek</a> ·
      <a href="https://dashscope.console.aliyun.com/apiKey" target="_blank" rel="noopener">通义千问 DashScope</a> ·
      <a href="https://console.cloud.tencent.com/hunyuan" target="_blank" rel="noopener">腾讯混元</a>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="saveAI()">保存设置</button>
      <button class="btn ghost" onclick="testAI()">测试连接</button>
    </div>
    <div class="hint" id="aiMsg"></div>
  </div>

  <div class="add card" style="margin-top:16px">
    <h3>➕ 添加自己的单词（仅本机保存）</h3>
    <input id="aW" placeholder="英文单词（如 abandon）">
    <input id="aPh" placeholder="音标（可选，如 /əˈbændən/）">
    <input id="aM" placeholder="中文释义，多个用逗号分（如 放弃,抛弃）">
    <div class="row">
      <button class="btn primary" onclick="addWord()">保存单词</button>
      <button class="btn ghost" onclick="clearWords()">清空我的单词</button>
      <button class="btn ghost" onclick="clearWrong()">清空错题本</button>
      <button class="btn ghost" onclick="clearMastered()">清空熟词本</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const CKEY="ky_words_custom_v1", WKEY="ky_words_wrong_v1", MKEY="ky_words_mastered_v1";
let mode="en2zh";
let judged=false, aiPending=false;   // 当前词是否已批改 / AI 判分是否进行中
let base=BANK.slice();
let order=[];      // 当前顺序（索引到 base）
let idx=0;
let cur=null;

function loadCustom(){try{return JSON.parse(localStorage.getItem(CKEY))||[]}catch(e){return[]}}
function loadWrong(){try{return new Set(JSON.parse(localStorage.getItem(WKEY))||[])}catch(e){return new Set()}}
function saveWrong(s){localStorage.setItem(WKEY,JSON.stringify([...s]))}
function loadMastered(){try{return new Set(JSON.parse(localStorage.getItem(MKEY))||[])}catch(e){return new Set()}}
function saveMastered(s){localStorage.setItem(MKEY,JSON.stringify([...s]))}

function rebuild(){
  const normM=e=>({w:e.w, ph:e.ph||"", pos:e.pos||"", alt:(e.alt||[]),
    m:(e.m||[]).flat(Infinity).filter(s=>typeof s==="string"&&s.trim()).map(s=>s.trim())});
  const merged=new Map();
  const put=e=>{
    if(!e.w)return;
    if(!merged.has(e.w)){ merged.set(e.w,{w:e.w,ph:e.ph,pos:e.pos,alt:[...e.alt],m:[...e.m]}); return; }
    const p=merged.get(e.w);
    const set=new Set(p.m); for(const mm of e.m) set.add(mm); p.m=[...set];
    if(!p.ph&&e.ph)p.ph=e.ph;
    if(!p.pos&&e.pos)p.pos=e.pos;
    p.alt=[...new Set([...(p.alt||[]),...e.alt])];
  };
  BANK.map(normM).forEach(put);
  loadCustom().map(x=>normM({w:x.w,ph:x.ph||"",pos:"",alt:x.alt||[],m:x.m||[]})).forEach(put);
  base=[...merged.values()];
}
function applyScope(){
  const scope=document.getElementById("scope").value;
  const wrong=loadWrong(), mast=loadMastered();
  let pool=base.map((_,i)=>i);
  if(scope==="wrong"){pool=pool.filter(i=>wrong.has(base[i].w)); if(pool.length===0){toast("暂无错题，先去刷全部词");document.getElementById("scope").value="all";pool=base.map((_,i)=>i);}}
  if(scope==="mast"){pool=pool.filter(i=>mast.has(base[i].w)); if(pool.length===0){toast("熟词本还是空的，答对了才会进来");document.getElementById("scope").value="all";pool=base.map((_,i)=>i);}}
  if(document.getElementById("rand").checked){for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}}
  order=pool;
  idx=0; render();
}
function setMode(m){
  mode=m;
  document.getElementById("mEn2zh").classList.toggle("on",m==="en2zh");
  document.getElementById("mZh2en").classList.toggle("on",m==="zh2en");
  document.getElementById("answer").placeholder = m==="en2zh" ? "在此写中文释义，回车=批改" : "Type the English word, Enter=check";
  applyScope();
}
function norm(s){ if(Array.isArray(s)) s=s.join(""); return (s||"").toLowerCase().replace(/[\s\p{P}]+/gu,"")}
function render(){
  if(order.length===0){applyScope();return;}
  cur=base[order[idx]];
  document.getElementById("metaInfo").textContent="第 "+(idx+1)+" / "+order.length+" 词  |  "+ (mode==="en2zh"?"看英文 → 写中文":"看中文 → 写英文");
  document.getElementById("prompt").textContent = mode==="en2zh" ? cur.w : cur.m[0];
  let h="";
  if(mode==="en2zh"){
    h += cur.pos?("词性："+cur.pos+"　"):"";
    h += cur.ph?("音标："+cur.ph):"";
  }else{
    h += cur.pos?("词性："+cur.pos+"　"):"";
    h += cur.ph?("音标："+cur.ph+"　"):"";
    h += "（提示：英文单词，注意拼写）";
  }
  document.getElementById("hint").textContent=h;
  document.getElementById("answer").value="";
  document.getElementById("result").classList.remove("show");
  judged=false; aiPending=false;
  updateStats();
}
function lev(a,b){a=a||"";b=b||"";const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];}
function onAnsKey(e){
  if(e.key!=="Enter")return;
  e.preventDefault();
  if(!judged) judge(); else next();
}
function judge(){
  const raw=document.getElementById("answer").value.trim();
  if(!raw){toast("先写答案再核对");return;}
  if(document.getElementById("judgeMode").value==="ai"){ aiJudge(raw); return; }
  judgeKeyword(raw);
}
function judgeKeyword(raw){
  let correct=false, near=false;
  if(mode==="en2zh"){
    const ans=norm(raw);
    correct = (cur.m||[]).some(mm=>ans.includes(norm(mm)));
  }else{
    const ans=norm(raw);
    const targets=[cur.w].concat(cur.alt||[]).map(norm);
    correct = targets.includes(ans);
    if(!correct){near = targets.some(t=>{const L=Math.max(t.length,ans.length);return L>0 && lev(ans,t)<=2 && Math.abs(t.length-ans.length)<=2;});}
  }
  finishJudge(raw, correct, near, "");
}
function finishJudge(raw, correct, near, reason){
  // 记录：答对进熟词本，答错进错题本（两者互斥）
  const wrong=loadWrong(), mast=loadMastered();
  if(correct){ mast.add(cur.w); wrong.delete(cur.w); }
  else { wrong.add(cur.w); mast.delete(cur.w); }
  saveWrong(wrong); saveMastered(mast);
  // 展示
  const v=document.getElementById("verdict");
  v.className="verdict "+(correct?"ok":"bad");
  v.textContent = correct?"✓ 正确":"✗ 错误";
  const cText = mode==="en2zh" ? (cur.m.join("；")) : (cur.w+(cur.alt&&cur.alt.length?(" / "+cur.alt.join(" / ")):""));
  document.getElementById("ansbox").innerHTML =
     '你的答案：<span class="y">'+escapeHtml(raw)+'</span><br>正确答案：<span class="c">'+escapeHtml(cText)+'</span>'+
     (cur.ph?('　'+cur.ph):'')+(cur.pos?('　'+cur.pos):'');
  let note;
  if(correct) note = "记牢它 👍 已进熟词本";
  else if(near && reason==="") note = "拼写接近，再确认一下字母顺序";
  else if(reason) note = reason;
  else note = "加入错题本，待会儿用“仅错题”复盘";
  document.getElementById("note").textContent = note;
  document.getElementById("result").classList.add("show");
  judged=true;
  updateStats();
}
function showAns(){
  const cText = mode==="en2zh" ? (cur.m.join("；")) : (cur.w+(cur.alt&&cur.alt.length?(" / "+cur.alt.join(" / ")):""));
  document.getElementById("verdict").className="verdict";
  document.getElementById("verdict").textContent="参考答案";
  document.getElementById("ansbox").innerHTML='正确答案：<span class="c">'+escapeHtml(cText)+'</span>'+(cur.ph?('　'+cur.ph):'')+(cur.pos?('　'+cur.pos):'');
  document.getElementById("note").textContent="";
  document.getElementById("result").classList.add("show");
  judged=true;
}
function next(){
  if(document.getElementById("randDraw") && document.getElementById("randDraw").checked){ randomDraw(); return; }
  idx=(idx+1)%order.length;render();
}
function randomDraw(){
  if(order.length===0){applyScope();return;}
  if(order.length===1){render();return;}
  let n=idx; while(n===idx) n=Math.floor(Math.random()*order.length);
  idx=n; render();
  const el=document.getElementById("answer"); if(el){ try{el.focus();}catch(e){} }
}
function prev(){idx=(idx-1+order.length)%order.length;render()}
function addWord(){
  const w=document.getElementById("aW").value.trim();
  const ph=document.getElementById("aPh").value.trim();
  const m=document.getElementById("aM").value.trim();
  if(!w||!m){toast("请填单词和释义");return;}
  const c=loadCustom();
  c.push({w,ph,m:m.split(/[,，、]/).map(s=>s.trim()).filter(Boolean)});
  localStorage.setItem(CKEY,JSON.stringify(c)); rebuild(); applyScope();
  document.getElementById("aW").value="";document.getElementById("aPh").value="";document.getElementById("aM").value="";
  toast("已保存，词库总数 "+base.length);
}
function clearWords(){
  if(!confirm("确定清空你添加的所有单词？"))return;
  localStorage.removeItem(CKEY); rebuild(); applyScope(); toast("已清空");
}
function clearWrong(){
  if(!confirm("确定清空错题本？"))return;
  localStorage.removeItem(WKEY); applyScope(); toast("错题本已清空");
}
function clearMastered(){
  if(!confirm("确定清空熟词本？"))return;
  localStorage.removeItem(MKEY); applyScope(); toast("熟词本已清空");
}
function updateStats(){
  const wrong=loadWrong(), mast=loadMastered();
  document.getElementById("stats").textContent="错题本："+wrong.size+" 词　|　熟词本："+mast.size+" 词";
}
function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}

// ===== AI 语义判分（OpenAI 兼容，仅存本机 localStorage）=====
const AIKEY="ky_ai_cfg_v1";
function loadAI(){try{return JSON.parse(localStorage.getItem(AIKEY))||{}}catch(e){return{}}}
function saveAICfg(o){localStorage.setItem(AIKEY,JSON.stringify(o))}
function onJudgeMode(){
  const m=document.getElementById("judgeMode").value;
  const panel=document.getElementById("aiPanel");
  if(m==="ai"){
    panel.style.display="";
    const cfg=loadAI();
    if(cfg.prov){document.getElementById("aiProv").value=cfg.prov; onProv();}
    if(cfg.key)document.getElementById("aiKey").value=cfg.key;
    if(cfg.model)document.getElementById("aiModel").value=cfg.model;
    if(cfg.base)document.getElementById("aiBase").value=cfg.base;
    if(!cfg.key){toast("请先在下方填写 AI 设置（API Key）再判分");}
  }else{
    panel.style.display="none";
  }
}
function onProv(){
  const p=document.getElementById("aiProv").value;
  const map={
    deepseek:{base:"https://api.deepseek.com/v1/chat/completions",model:"deepseek-chat"},
    qwen:{base:"https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions",model:"qwen-plus"},
    hunyuan:{base:"https://api.hunyuan.cloud.tencent.com/v1/chat/completions",model:"hunyuan-lite"},
    custom:{base:"",model:""}
  };
  const c=map[p]||map.custom;
  document.getElementById("aiBase").value=c.base;
  document.getElementById("aiModel").value=c.model;
}
function saveAI(){
  const cfg={
    prov:document.getElementById("aiProv").value,
    key:document.getElementById("aiKey").value.trim(),
    model:document.getElementById("aiModel").value.trim(),
    base:document.getElementById("aiBase").value.trim()
  };
  if(!cfg.key){document.getElementById("aiMsg").textContent="⚠️ 请填写 API Key";return;}
  if(!cfg.base){document.getElementById("aiMsg").textContent="⚠️ 请填写 API Base URL（选自定义时必需）";return;}
  saveAICfg(cfg);
  document.getElementById("aiMsg").textContent="✓ 已保存（仅存在本机浏览器）";
}
function testAI(){
  const cfg=loadAI();
  if(!cfg.key||!cfg.base){document.getElementById("aiMsg").textContent="⚠️ 请先填写并保存设置";return;}
  document.getElementById("aiMsg").textContent="连接测试中…";
  fetch(cfg.base,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},body:JSON.stringify({model:cfg.model||"",messages:[{role:"user",content:"回复 ok"}],stream:false})})
    .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(d=>{document.getElementById("aiMsg").textContent="✓ 连接成功";})
    .catch(e=>{document.getElementById("aiMsg").textContent="✗ 失败："+e.message;});
}
function aiJudge(raw){
  if(aiPending)return;
  const cfg=loadAI();
  if(!cfg.key||!cfg.base){toast("请先在下方填写并保存 AI 设置（API Key）");document.getElementById("aiPanel").style.display="";onJudgeMode();return;}
  const v=document.getElementById("verdict");
  v.className="verdict"; v.textContent="🤖 AI 判断中…";
  document.getElementById("ansbox").innerHTML="";
  document.getElementById("note").textContent="正在请大模型按“词义接近即可”判分…";
  document.getElementById("result").classList.add("show");
  aiPending=true;
  const std = mode==="en2zh" ? (cur.m.join("；")) : (cur.w+(cur.alt&&cur.alt.length?(" / "+cur.alt.join(" / ")):""));
  const prompt = mode==="en2zh"
    ? ("你是考研英语判分助手。标准释义（可能含多个义项）："+std+"\n学生写的汉语答案："+raw+"\n请判断学生答案与标准释义是否“词义接近”。只要意思贴近、能表达核心含义就算正确（不必字字对应；错别字只要能看出意思也可算对）。\n只返回一个 JSON：{\"correct\":true 或 false,\"reason\":\"一句话说明为什么对或错\"}。不要输出其它内容。")
    : ("你是考研英语判分助手。标准英文单词："+std+"\n学生写的英文答案："+raw+"\n请判断学生答案是否表达同一个词（忽略大小写、英美拼写差异、末尾少 s/es/ed 等轻微变形，只要核心词义一致就算对）。\n只返回一个 JSON：{\"correct\":true 或 false,\"reason\":\"一句话说明\"}。不要输出其它内容。");
  fetch(cfg.base,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},body:JSON.stringify({model:cfg.model||"",messages:[{role:"user",content:prompt}],stream:false,temperature:0})})
    .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(d=>{
      let txt=""; try{txt=d.choices[0].message.content;}catch(e){throw new Error("返回格式异常");}
      let json=null;
      try{ json=JSON.parse(txt.replace(/```json|```/g,"").trim()); }catch(e){
        const mt=txt.match(/\{[\s\S]*\}/); if(mt){try{json=JSON.parse(mt[0]);}catch(e2){}}
      }
      if(!json||typeof json.correct!=="boolean")throw new Error("AI 未返回有效判分");
      finishJudge(raw, json.correct, false, json.correct?"":("AI："+json.reason));
    })
    .catch(e=>{
      document.getElementById("note").textContent="⚠️ AI 判分失败（"+e.message+"），已退回关键词自检";
      judgeKeyword(raw);
    })
    .finally(()=>{ aiPending=false; });
}
